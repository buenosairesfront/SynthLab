<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SynthLab — Conocé la síntesis viendo y escuchando</title>
<meta name="description" content="Un acercamiento breve y visual a la síntesis de sonido: osciladores, filtros, envolventes, LFO, FM, wavetable y aditiva. Funciona en el navegador, sin descargas.">
<meta name="theme-color" content="#0B0B14">
<meta property="og:title" content="SynthLab — Conocé la síntesis viendo y escuchando">
<meta property="og:description" content="Un acercamiento breve y visual a la síntesis de sonido, en el navegador y sin descargas.">
<meta property="og:image" content="img/filter.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#0B0B14;--panel:#151527;--line:#26264a;--text:#EDEBFF;--dim:#8C89B5;--pink:#FF4FD8;--cyan:#3EF0FF;--lime:#B6FF3B;--orange:#FFB23E;--violet:#8A7DFF;--red:#FF5A6E}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","PingFang SC","Hiragino Sans","Noto Sans Devanagari",sans-serif;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
nav.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:#0b0b14b8;border-bottom:1px solid #ffffff0d}
nav.top .wrap{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;text-decoration:none}
.brand svg{width:30px;height:30px;filter:drop-shadow(0 0 6px var(--pink))}
nav.top .sp{flex:1}
nav.top a.l{font-size:14px;color:var(--dim);text-decoration:none}
nav.top a.l:hover{color:var(--text)}
.lang{padding:6px 8px;border-radius:10px;background:#1c1c33;color:var(--text);border:1px solid var(--line);font:inherit;font-size:13px}
@media(max-width:700px){nav.top a.l{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 22px;border-radius:14px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:#1c1c33;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:linear-gradient(135deg,var(--pink),var(--violet));border:0;color:#fff;box-shadow:0 8px 30px #ff4fd855}
.btn.pri:hover{box-shadow:0 10px 40px #ff4fd899}
.btn svg{width:20px;height:20px;flex:none}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
/* hero */
.hero{user-select:none;-webkit-user-select:none;position:relative;min-height:min(92vh,820px);display:flex;align-items:center;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(70% 60% at 70% 30%,#2a145088,transparent),radial-gradient(60% 50% at 10% 80%,#0f3a4a55,transparent)}
#wave{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;pointer-events:none;padding-top:40px;padding-bottom:40px}
.hero .wrap>*{pointer-events:auto}
.hero .wrap>div:first-child{pointer-events:none}
.hero .wrap>div:first-child .ctas,.hero .wrap>div:first-child .lang{pointer-events:auto}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);border:1px solid #3ef0ff55;padding:5px 12px;border-radius:30px;background:#3ef0ff11}
h1{font-size:clamp(42px,7vw,84px);line-height:1;margin:18px 0 16px;letter-spacing:-.035em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--pink) 60%,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px #ff4fd855)}
.lead{font-size:19px;color:#c9c6ee;max-width:580px;margin:0 0 26px}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.nodl{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:15px;color:var(--lime);font-weight:600}
.nodl svg{width:20px;height:20px;flex:none}
.hint{margin-top:10px;font-size:13px;color:var(--dim);display:flex;align-items:center;gap:8px}
.hint i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.2}}
.toast{margin-top:14px;max-width:560px;font-size:14px;color:var(--text);background:#1c1c33;border:1px solid var(--cyan);border-radius:12px;padding:12px 14px;display:none}
.toast.on{display:block}
.phone{position:relative;width:min(320px,80vw);aspect-ratio:585/1266;margin:0 auto;border-radius:44px;padding:10px;background:linear-gradient(160deg,#2b2b4a,#0c0c18);box-shadow:0 30px 80px #000c,0 0 0 1px #ffffff14,0 0 80px #ff4fd833}
.phone .scr{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#000}
.phone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.phone img.on{opacity:1}
.phone:before{content:'';position:absolute;top:18px;left:50%;transform:translateX(-50%);width:80px;height:20px;border-radius:12px;background:#000;z-index:2}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}.phone{width:min(270px,70vw)}}
/* sections */
section{padding:90px 0;position:relative}
h2{font-size:clamp(30px,4.4vw,48px);line-height:1.1;margin:0 0 14px;letter-spacing:-.025em}
.kicker{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);margin-bottom:10px}
.sub{color:var(--dim);font-size:18px;max-width:680px;margin:0 0 40px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-50px;position:relative;z-index:3}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
.stat b{display:block;font-size:40px;line-height:1;background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.stat span{font-size:13px;color:var(--dim)}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.mode{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 14%,transparent),var(--panel) 55%);border:1px solid var(--line);border-radius:24px;padding:22px;overflow:hidden}
.mode img{width:150px;border-radius:18px;box-shadow:0 14px 40px #000a;border:1px solid #ffffff14}
.mode h3{margin:0 0 6px;font-size:24px;color:var(--c)}
.mode p{margin:0;color:#c9c6ee;font-size:15px}
.mode ul{margin:10px 0 0;padding-left:18px;color:var(--dim);font-size:14px}
@media(max-width:900px){.modes{grid-template-columns:1fr}}
@media(max-width:460px){.mode{grid-template-columns:1fr}.mode img{width:100%;max-width:220px}}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mod{position:relative;padding:20px 20px 20px 24px;border-radius:18px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.mod:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);box-shadow:0 0 14px var(--c)}
.mod small{color:var(--c);font-weight:800;font-size:12px;letter-spacing:.1em}
.mod b{display:block;font-size:18px;margin:2px 0 4px}
.mod span{font-size:14px;color:var(--dim)}
.mod svg{position:absolute;right:14px;top:16px;width:70px;height:28px;opacity:.9}
@media(max-width:900px){.mods{grid-template-columns:1fr 1fr}}@media(max-width:560px){.mods{grid-template-columns:1fr}}
.strip{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 20px 30px;margin:0 -20px;scrollbar-width:thin}
.strip figure{flex:none;margin:0;scroll-snap-align:center;width:230px;text-align:center}
.strip img{width:100%;border-radius:24px;border:1px solid #ffffff1a;box-shadow:0 18px 50px #000b;transition:transform .3s}
.strip img:hover{transform:translateY(-6px) rotate(-1deg)}
.strip figcaption{font-size:13px;color:var(--dim);margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 16px;border-radius:30px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);font-weight:700;font-size:14px;transition:.2s}
.chip:hover,.chip.on{background:var(--c);color:#111;box-shadow:0 0 20px color-mix(in srgb,var(--c) 70%,transparent)}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;position:relative}
.step:before{counter-increment:s;content:counter(s);display:flex;width:38px;height:38px;border-radius:50%;align-items:center;justify-content:center;font-weight:900;background:linear-gradient(135deg,var(--pink),var(--violet));margin-bottom:12px;box-shadow:0 0 20px #ff4fd866}
.step b{display:block;margin-bottom:6px}.step p{margin:0;color:var(--dim);font-size:14px}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}@media(max-width:500px){.steps{grid-template-columns:1fr}}
.cta-final{text-align:center;padding:70px 24px;border-radius:30px;background:radial-gradient(80% 120% at 50% 0%,#3a1466,#151527);border:1px solid #4a2a7a;box-shadow:0 0 100px #ff4fd822 inset}
.cta-final .ctas{justify-content:center}
.tech{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tech div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;font-size:14px;color:var(--dim)}
.tech b{display:block;color:var(--text);margin-bottom:4px;font-size:15px}
@media(max-width:800px){.tech{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--dim);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}
</style>

<script>
(() => {
  const D = window.LANDING_I18N;
  const LANGS = ['es', 'en', 'de', 'zh', 'ja', 'hi'];
  // same saved choice as the app (synthlab.lang), else the browser language
  let lang = (() => {
    try { const s = localStorage.getItem('synthlab.lang'); if (D[s]) return s; } catch (e) {}
    for (const x of navigator.languages || [navigator.language || 'en']) { const k = String(x).slice(0, 2).toLowerCase(); if (D[k]) return k; }
    return 'en';
  })();
  const T = (k) => (D[lang][k] != null ? D[lang][k] : D.es[k]);
  const COLS = ['#3EF0FF', '#FF4FD8', '#B6FF3B', '#FFB23E', '#8A7DFF', '#3EF0FF', '#FFB23E', '#FF4FD8', '#B6FF3B'];
  const NLES = [2, 4, 4, 3, 2, 2, 3, 2, 2];
  const SHOTS = ['filter', 'wavetable', 'adsr', 'fm', 'additive', 'chaos', 'lissajous'];
  const sel = document.getElementById('lang');
  LANGS.forEach((k) => { const o = document.createElement('option'); o.value = k; o.textContent = D[k]._name; sel.append(o); });
  sel.onchange = () => { lang = sel.value; try { localStorage.setItem('synthlab.lang', lang); } catch (e) {} apply(); };

  const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && (e.target.classList.add('in'), io.unobserve(e.target))), { threshold: 0.12 });
  const wp = (i) => { let d = ''; for (let x = 0; x <= 70; x++) { const t = (x / 70) * Math.PI * 4; const y = [Math.sin(t), Math.sin(t) + Math.sin(3 * t) / 3, ((t / Math.PI) % 2) - 1][i % 3]; d += (x ? 'L' : 'M') + x + ',' + (14 - y * 10).toFixed(1); } return d; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function apply() {
    sel.value = lang;
    document.documentElement.lang = lang;
    document.title = T('title');
    document.querySelector('meta[name=description]').content = T('metaDesc');
    document.querySelectorAll('[data-i18n]').forEach((el) => (el.textContent = T(el.dataset.i18n)));
    document.querySelectorAll('[data-i18n-html]').forEach((el) => (el.innerHTML = T(el.dataset.i18nHtml)));
    document.getElementById('mods').innerHTML = T('mods').map(([t, s], i) => `<div class="mod reveal in" style="--c:${COLS[i]}"><svg viewBox="0 0 70 28"><path d="${wp(i)}" fill="none" stroke="${COLS[i]}" stroke-width="2"/></svg><small>${i + 1} · ${NLES[i]} ${esc(T('lessons'))}</small><b>${esc(t)}</b><span>${esc(s)}</span></div>`).join('');
    document.getElementById('strip').innerHTML = SHOTS.map((s, i) => `<figure><img src="img/${s}.jpg" alt="" loading="lazy"><figcaption>${esc(T('cap')[i])}</figcaption></figure>`).join('');
    renderChips();
  }

  // ---------- install as a desktop app (PWA) ----------
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; });
  document.querySelectorAll('.install').forEach((b) => b.addEventListener('click', async () => {
    if (installEvt) { installEvt.prompt(); await installEvt.userChoice; installEvt = null; }
    else { const h = document.getElementById('installHelp'); h.classList.add('on'); h.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }));
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

  // phone slideshow
  const imgs = [...document.querySelectorAll('#phone img')]; let k = 0;
  setInterval(() => { imgs[k].classList.remove('on'); k = (k + 1) % imgs.length; imgs[k].classList.add('on'); }, 2800);

  // ---------- tiny synth for the hero + recipe previews ----------
  let ac, out, ana, buf;
  const audio = () => {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ac.createDynamicsCompressor(); out = ac.createGain(); out.gain.value = 0.5;
      const dl = ac.createDelay(1), fb = ac.createGain(); dl.delayTime.value = 0.32; fb.gain.value = 0.35;
      out.connect(comp); out.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(comp);
      ana = ac.createAnalyser(); ana.fftSize = 2048; buf = new Float32Array(2048);
      comp.connect(ana); ana.connect(ac.destination);
    }
    if (ac.state !== 'running') ac.resume();
    return ac;
  };
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, dur, o) {
    o = Object.assign({ wave: 'sawtooth', cut: 2000, q: 4, env: 3000, a: 0.005, d: 0.3, s: 0.3, r: 0.3, det: 8 }, o);
    const c = audio(); t = t || c.currentTime;
    const g = c.createGain(), f = c.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = o.q;
    f.frequency.setValueAtTime(o.cut + o.env, t); f.frequency.setTargetAtTime(o.cut, t, o.d / 3);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.5, t + o.a); g.gain.setTargetAtTime(0.5 * o.s, t + o.a, o.d / 3);
    g.gain.setTargetAtTime(0, t + dur, o.r / 4);
    const oscs = [-1, 1].map((s) => { const x = c.createOscillator(); x.type = o.wave; x.frequency.value = mtof(m); x.detune.value = s * o.det; x.connect(f); x.start(t); x.stop(t + dur + o.r * 2); return x; });
    if (o.fm) { const md = c.createOscillator(), mg = c.createGain(); md.frequency.value = mtof(m) * o.fm; mg.gain.setValueAtTime(mtof(m) * o.fm * o.idx, t); mg.gain.setTargetAtTime(0, t, 0.4); md.connect(mg); oscs.forEach((x) => mg.connect(x.frequency)); md.start(t); md.stop(t + dur + o.r * 2); }
    f.connect(g); g.connect(out);
    return { f, g, oscs };
  }
  // hero: touch & drag = pitch (x, pentatonic) and cutoff (y)
  const cv = document.getElementById('wave'), g2 = cv.getContext('2d');
  const PENTA = [0, 3, 5, 7, 10];
  let live = null, lastNote = null, tt = 0;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  const noteAt = (x) => { const s = Math.floor(x * 15); return 45 + Math.floor(s / 5) * 12 + PENTA[s % 5]; };
  const cutAt = (y) => 200 * Math.pow(40, 1 - y);
  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    const [x, y] = pos(e); lastNote = noteAt(x);
    live = note(lastNote, 0, 60, { cut: cutAt(y), env: 1500, a: 0.01, d: 0.4, s: 0.7, r: 0.5, q: 7 });
  });
  cv.addEventListener('pointermove', (e) => {
    if (!live) return;
    const [x, y] = pos(e), n = noteAt(x), t = ac.currentTime;
    live.f.frequency.cancelScheduledValues(t); live.f.frequency.setTargetAtTime(cutAt(y), t, 0.03);
    if (n !== lastNote) { lastNote = n; live.oscs.forEach((o) => o.frequency.setTargetAtTime(mtof(n), t, 0.03)); }
  });
  const up = () => { if (!live) return; const t = ac.currentTime; live.g.gain.cancelScheduledValues(t); live.g.gain.setTargetAtTime(0, t, 0.12); live.oscs.forEach((o) => o.stop(t + 1)); live = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  function draw() {
    const d = Math.min(devicePixelRatio || 1, 2), w = Math.round(cv.clientWidth * d), h = Math.round(cv.clientHeight * d);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    g2.clearRect(0, 0, w, h); tt += 0.01;
    let energy = 0;
    if (ana) { ana.getFloatTimeDomainData(buf); for (let i = 0; i < 2048; i += 8) energy = Math.max(energy, Math.abs(buf[i])); }
    ['#FF4FD8', '#3EF0FF', '#8A7DFF', '#B6FF3B'].forEach((c, k) => {
      g2.beginPath();
      for (let i = 0; i <= 240; i++) {
        const x = i / 240, env = Math.pow(Math.sin(Math.PI * x), 1.5);
        let y = Math.sin(x * Math.PI * (3 + k) + tt * (1 + k * 0.6)) * 0.55 + Math.sin(x * Math.PI * (7 + k * 2) - tt * 2) * 0.25;
        if (ana && energy > 0.01) y += buf[(i * 8 + k * 64) % 2048] * 3;
        g2.lineTo(x * w, h * (0.5 + k * 0.04) + y * env * h * (0.09 + energy * 0.25));
      }
      g2.strokeStyle = c; g2.globalAlpha = k === 3 ? 0.35 : 0.6; g2.lineWidth = 2 * d; g2.shadowColor = c; g2.shadowBlur = (12 + energy * 40) * d; g2.stroke();
    });
    g2.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();

  const R = [
    ['#B6FF3B', (t) => [36, 36, 48, 36, 39, 36, 46, 43].forEach((n, i) => note(n, t + i * 0.14, 0.1, { cut: 250, q: 18, env: 3500, d: 0.18, s: 0.4, r: 0.05 }))],
    ['#8A7DFF', (t) => [48, 55, 58, 63].forEach((n) => note(n, t, 2.2, { cut: 1500, env: 0, a: 0.8, s: 0.9, r: 1.5, det: 14 }))],
    ['#3EF0FF', (t) => [60, 63, 67, 70, 72, 70, 67, 63].forEach((n, i) => note(n, t + i * 0.16, 0.08, { wave: 'square', cut: 400, env: 4000, d: 0.12, s: 0, r: 0.2 }))],
    ['#FF4FD8', (t) => [72, 74, 75, 79].forEach((n, i) => note(n, t + i * 0.3, 0.27, { cut: 6000, env: 0, det: 25, s: 0.9 }))],
    ['#FFB23E', (t) => note(31, t, 1.6, { cut: 900, env: 300, det: 22, s: 1, d: 1, q: 2 })],
    ['#3EF0FF', (t) => [72, 79, 76].forEach((n, i) => note(n, t + i * 0.6, 0.1, { wave: 'sine', cut: 15000, env: 0, q: 0.5, d: 2.5, s: 0, r: 2, fm: 3.5, idx: 3.5, det: 0 }))],
    ['#FF5A6E', (t) => [0, 0.5, 1].forEach((st) => { const c = audio(), o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(180, t + st); o.frequency.exponentialRampToValueAtTime(45, t + st + 0.08); g.gain.setValueAtTime(0.9, t + st); g.gain.setTargetAtTime(0, t + st, 0.12); o.connect(g); g.connect(out); o.start(t + st); o.stop(t + st + 0.8); })],
    ['#B6FF3B', (t) => { const c = audio(), b = c.createBuffer(1, c.sampleRate, c.sampleRate), x = b.getChannelData(0); for (let i = 0; i < x.length; i++) x[i] = Math.random() * 2 - 1; [0, 0.15, 0.3, 0.45, 0.6, 0.75].forEach((st, i) => { const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = b; f.type = 'highpass'; f.frequency.value = i % 4 === 2 ? 1500 : 7000; g.gain.setValueAtTime(0.5, t + st); g.gain.setTargetAtTime(0, t + st, i % 4 === 2 ? 0.06 : 0.02); s.connect(f); f.connect(g); g.connect(out); s.start(t + st); s.stop(t + st + 0.4); }); }],
    ['#FF4FD8', (t) => { const v = note(36, t, 1.4, { cut: 400, env: 0, q: 10, s: 1, det: 10 }); for (let i = 0; i < 14; i++) v.f.frequency.setTargetAtTime(i % 2 ? 300 : 2400, t + i * 0.1, 0.03); }],
    ['#FFB23E', (t) => [57, 64, 60, 67].forEach((n, i) => note(n, t + i * 0.4, 0.35, { wave: 'sine', cut: 15000, env: 0, q: 0.5, d: 1.5, s: 0.15, r: 0.5, fm: 1, idx: 3, det: 3 }))],
  ];
  function renderChips() {
    const chips = document.getElementById('chips');
    chips.innerHTML = '';
    R.forEach(([c, fn], i) => { const b = document.createElement('button'); b.className = 'chip'; b.style.setProperty('--c', c); b.textContent = '▶ ' + T('rcp')[i]; b.onclick = () => { fn(audio().currentTime + 0.05); b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 1400); }; chips.append(b); });
  }

  apply();
  document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
})();
</script>
</body>
</html>
